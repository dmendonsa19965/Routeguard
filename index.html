<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RouteGuard — Off-Road Routes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAh2BTiM5BGmD_zaJAaOqGMweSgKXiVd2E&libraries=places&callback=initAutocomplete" async defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1f2433;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#e8eaf0;--text2:#8a8fa8;
  --red:#ff4757;--red-bg:rgba(255,71,87,0.12);
  --amber:#ffa502;--amber-bg:rgba(255,165,2,0.12);
  --blue:#3d8ef0;--blue-bg:rgba(61,142,240,0.12);
  --green:#2ed573;--green-bg:rgba(46,213,115,0.12);
  --yellow:#ffe234;--yellow-bg:rgba(255,226,52,0.12);
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,0.12);
  --cyan:#00e5ff;
  --font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;background:var(--surface);border-bottom:1px solid var(--border2);flex-shrink:0;z-index:1000}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:28px;height:28px;background:var(--red);clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%)}
.logo-text{font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase}
.logo-sub{font-family:var(--mono);font-size:10px;color:var(--text2);letter-spacing:0.05em}
.header-right{display:flex;align-items:center;gap:8px}
.btn{font-family:var(--font);font-size:12px;font-weight:500;padding:6px 14px;border-radius:4px;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);transition:all 0.15s}
.btn:hover{background:var(--border);color:var(--text)}
.app{display:flex;flex:1;overflow:hidden}
.sidebar{width:290px;background:var(--surface);border-right:1px solid var(--border2);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-section{padding:12px 14px;border-bottom:1px solid var(--border)}
.sidebar-title{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text2);margin-bottom:8px}
.layer-item{display:flex;align-items:center;justify-content:space-between;padding:5px 0}
.layer-left{display:flex;align-items:center;gap:8px}
.layer-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.layer-name{font-size:12px;color:var(--text)}
.layer-count{font-family:var(--mono);font-size:10px;color:var(--text2);background:var(--surface2);padding:2px 6px;border-radius:10px}
.toggle{position:relative;width:32px;height:18px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--surface2);border-radius:18px;cursor:pointer;transition:0.2s;border:1px solid var(--border2)}
.toggle-slider:before{content:'';position:absolute;width:12px;height:12px;left:2px;top:2px;background:var(--text2);border-radius:50%;transition:0.2s}
.toggle input:checked+.toggle-slider{background:var(--red);border-color:var(--red)}
.toggle input:checked+.toggle-slider:before{transform:translateX(14px);background:#fff}
.restriction-list{flex:1;overflow-y:auto;padding:6px}
.restriction-list::-webkit-scrollbar{width:4px}
.restriction-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.rc{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px 8px 13px;margin-bottom:5px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden}
.rc:hover{border-color:var(--border2)}
.rc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.rc.prohibited::before{background:var(--red)}
.rc.caution::before,.rc.caution_zone::before{background:var(--amber)}
.rc.approved::before{background:var(--green)}
.rc.lz_caution::before{background:var(--yellow)}
.rc.lz_approved::before{background:var(--cyan)}
.rc.waypoint::before{background:var(--blue)}
.rc.road_block::before{background:var(--purple)}
.rc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.rc-name{font-size:12px;font-weight:500;color:var(--text);flex:1;margin-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-badge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:0.05em;flex-shrink:0}
.b-prohibited{background:var(--red-bg);color:var(--red)}
.b-caution,.b-caution_zone{background:var(--amber-bg);color:var(--amber)}
.b-approved{background:var(--green-bg);color:var(--green)}
.b-lz_caution{background:var(--yellow-bg);color:var(--yellow)}
.b-lz_approved{background:rgba(0,229,255,0.12);color:var(--cyan)}
.b-waypoint{background:var(--blue-bg);color:var(--blue)}
.b-road_block{background:var(--purple-bg);color:var(--purple)}
.rc-note{font-size:10px;color:var(--text2);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-header{font-family:var(--mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text2);padding:8px 6px 4px;opacity:0.7}
#map{flex:1}
.leaflet-container{background:#1a1f2e}
.leaflet-control-zoom{border:1px solid var(--border2)!important}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--text)!important;border-bottom:1px solid var(--border2)!important}
.leaflet-control-zoom a:hover{background:var(--surface2)!important}
.leaflet-control-layers{background:var(--surface)!important;border:1px solid var(--border2)!important;color:var(--text)!important;font-family:var(--font)!important;font-size:12px!important;border-radius:6px!important}
.leaflet-control-layers-base label{color:var(--text)!important;padding:3px 0!important;display:block}
.statusbar{height:26px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;flex-shrink:0}
.status-item{font-family:var(--mono);font-size:10px;color:var(--text2);display:flex;align-items:center;gap:6px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
/* NAVIGATION SECTION */
.nav-wrap{position:relative}
.nav-input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:12px;padding:8px 10px 8px 30px;border-radius:4px;outline:none;transition:border-color 0.15s}
.nav-input:focus{border-color:var(--cyan)}
.nav-input::placeholder{color:var(--text2)}
.nav-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:13px;pointer-events:none}
.nav-btn{width:100%;margin-top:7px;padding:8px;background:var(--cyan);color:#0f1117;border:none;border-radius:4px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;letter-spacing:0.04em;transition:background 0.15s}
.nav-btn:hover{background:#33ecff}
/* POPUP NAV BUTTON */
.popup-nav-btn{display:block;width:100%;margin-top:10px;padding:7px;background:var(--cyan);color:#0f1117;border:none;border-radius:4px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;text-align:center;letter-spacing:0.04em;text-decoration:none;transition:background 0.15s}
.popup-nav-btn:hover{background:#33ecff}
/* CUSTOM POPUP */
.custom-popup .leaflet-popup-content-wrapper{background:var(--surface);border:1px solid var(--border2);color:var(--text);border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.5);padding:0}
.custom-popup .leaflet-popup-content{margin:12px 14px;font-family:var(--font);min-width:180px}
.custom-popup .leaflet-popup-tip-container{display:none}
.popup-cat{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text2);margin-bottom:3px}
.popup-name{font-size:13px;font-weight:600;margin-bottom:4px}
.popup-folder{font-size:10px;color:var(--text2);margin-bottom:3px;opacity:0.7}
.popup-note{font-size:11px;color:var(--text2);line-height:1.5}
/* FEATURE SEARCH */
.search-box{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:var(--font);font-size:12px;padding:7px 10px;border-radius:4px;margin-bottom:0}
.search-box::placeholder{color:var(--text2)}
.search-box:focus{outline:none;border-color:var(--red)}
/* PAC (Google Places autocomplete) */
.pac-container{background:var(--surface)!important;border:1px solid var(--border2)!important;border-radius:6px!important;font-family:var(--font)!important;margin-top:2px!important;box-shadow:0 8px 24px rgba(0,0,0,0.6)!important;z-index:99999!important}
.pac-item{padding:7px 12px!important;color:var(--text2)!important;font-size:12px!important;border-top:1px solid var(--border)!important;cursor:pointer!important}
.pac-item:hover,.pac-item-selected{background:var(--surface2)!important}
.pac-item-query{color:var(--text)!important;font-size:12px!important}
.pac-icon{display:none!important}
.pac-matched{color:var(--cyan)!important;font-weight:600}
@media(max-width:640px){.sidebar{width:100%;max-height:45vh}.app{flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon"></div>
    <div>
      <div class="logo-text">RouteGuard</div>
      <div class="logo-sub">Off-Road Routes — Google Satellite</div>
    </div>
  </div>
  <div class="header-right">
    <span class="status-item" style="font-family:var(--mono);font-size:11px;color:var(--green)">● 325 features loaded</span>
    <button class="btn" onclick="loadAndRenderLZs()" title="Refresh LZ data from Google Sheet">↻ Refresh</button>
    <button class="btn" onclick="fitAll()">Fit All</button>
    <button class="btn" onclick="exportJSON()">Export JSON</button>
  </div>
</header>

<div class="app">
  <div class="sidebar">

    <!-- NAVIGATE TO -->
    <div class="sidebar-section">
      <div class="sidebar-title">🧭 Navigate To</div>
      <div class="nav-wrap">
        <span class="nav-icon">⌕</span>
        <input class="nav-input" id="navInput" placeholder="Address, LZ name, or coordinates..." oninput="onNavInput()" autocomplete="off">
      </div>
      <!-- LZ PREVIEW CARD — shown when a known LZ is matched -->
      <div id="lzPreview" style="display:none;margin-top:8px;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:10px 12px;position:relative;overflow:hidden">
        <div id="lzPreviewBar" style="position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <span id="lzPreviewBadge" style="font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:0.05em;background:rgba(0,229,255,0.12);color:var(--cyan)">LZ</span>
          <span onclick="clearNavInput()" style="font-size:11px;color:var(--text2);cursor:pointer;opacity:0.6">✕</span>
        </div>
        <div id="lzPreviewName" style="font-size:13px;font-weight:600;color:var(--cyan);margin-bottom:5px"></div>
        <div id="lzPreviewDetails" style="font-size:11px;color:var(--text2);line-height:1.7"></div>
        <div id="lzPreviewCoords" style="font-family:var(--mono);font-size:10px;color:var(--text2);margin-top:5px;opacity:0.6"></div>
      </div>
      <button class="nav-btn" id="navBtn" onclick="openNavigation()">▶ Open in Google Maps</button>
    </div>

    <!-- LAYERS -->
    <div class="sidebar-section">
      <div class="sidebar-title">Layers</div>
      <div class="layer-item">
        <div class="layer-left"><div class="layer-dot" style="background:var(--red)"></div><span class="layer-name">Prohibited</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="layer-count" id="cnt-prohibited">0</span><label class="toggle"><input type="checkbox" id="tog-prohibited" checked onchange="toggleLayer('prohibited')"><span class="toggle-slider"></span></label></div>
      </div>
      <div class="layer-item">
        <div class="layer-left"><div class="layer-dot" style="background:var(--amber)"></div><span class="layer-name">Caution Routes</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="layer-count" id="cnt-caution">0</span><label class="toggle"><input type="checkbox" id="tog-caution" checked onchange="toggleLayer('caution')"><span class="toggle-slider"></span></label></div>
      </div>
      <div class="layer-item">
        <div class="layer-left"><div class="layer-dot" style="background:var(--amber)"></div><span class="layer-name">Caution Zones</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="layer-count" id="cnt-caution_zone">0</span><label class="toggle"><input type="checkbox" id="tog-caution_zone" checked onchange="toggleLayer('caution_zone')"><span class="toggle-slider"></span></label></div>
      </div>
      <div class="layer-item">
        <div class="layer-left"><div class="layer-dot" style="background:var(--green)"></div><span class="layer-name">Approved Routes</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="layer-count" id="cnt-approved">0</span><label class="toggle"><input type="checkbox" id="tog-approved" checked onchange="toggleLayer('approved')"><span class="toggle-slider"></span></label></div>
      </div>
      <div class="layer-item">
        <div class="layer-left"><div class="layer-dot" style="background:var(--yellow)"></div><span class="layer-name">LZs (Caution)</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="layer-count" id="cnt-lz_caution">0</span><label class="toggle"><input type="checkbox" id="tog-lz_caution" checked onchange="toggleLayer('lz_caution')"><span class="toggle-slider"></span></label></div>
      </div>
      <div class="layer-item">
        <div class="layer-left"><div class="layer-dot" style="background:var(--cyan)"></div><span class="layer-name">LZs (Approved)</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="layer-count" id="cnt-lz_approved">0</span><label class="toggle"><input type="checkbox" id="tog-lz_approved" checked onchange="toggleLayer('lz_approved')"><span class="toggle-slider"></span></label></div>
      </div>
      <div class="layer-item">
        <div class="layer-left"><div class="layer-dot" style="background:var(--blue)"></div><span class="layer-name">Waypoints</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="layer-count" id="cnt-waypoint">0</span><label class="toggle"><input type="checkbox" id="tog-waypoint" checked onchange="toggleLayer('waypoint')"><span class="toggle-slider"></span></label></div>
      </div>
      <div class="layer-item">
        <div class="layer-left"><div class="layer-dot" style="background:var(--purple)"></div><span class="layer-name">Road Blocks</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span class="layer-count" id="cnt-road_block">0</span><label class="toggle"><input type="checkbox" id="tog-road_block" checked onchange="toggleLayer('road_block')"><span class="toggle-slider"></span></label></div>
      </div>
    </div>

    <!-- FEATURE SEARCH -->
    <div class="sidebar-section" style="padding:10px 14px">
      <input class="search-box" id="searchBox" placeholder="Filter features on map..." oninput="filterList()">
    </div>

    <div class="restriction-list" id="featureList"></div>
  </div>
  <div id="map"></div>
</div>

<div class="statusbar">
  <span class="status-item"><span class="status-dot"></span>Map active</span>
  <span class="status-item" id="coordDisplay">Lat — Lng —</span>
  <span class="status-item" id="totalCount">325 features</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

function parseCoordPair(raw) {
  if (!raw) return null;
  let s = String(raw).trim().replace(/[\u2018\u2019]/g, "'").replace(/\s+/g, ' ');
  let m = s.match(/(\d+)[\u00B0\s]+(\d+)['\s]+([\d.]+)"?\s*([NS])[,\s]+(\d+)[\u00B0\s]+(\d+)['\s]+([\d.]+)"?\s*([EW])/i);
  if (m) {
    let lat = +m[1] + +m[2]/60 + +m[3]/3600;
    let lng = +m[5] + +m[6]/60 + +m[7]/3600;
    if (m[4].toUpperCase()==='S') lat=-lat;
    if (m[8].toUpperCase()==='W') lng=-lng;
    return [+lat.toFixed(5), +lng.toFixed(5)];
  }
  m = s.match(/(\d+)[\u00B0\s]+([\d.]+)'?\s*([NS])[,\s]+(\d+)[\u00B0\s]+([\d.]+)'?\s*([EW])/i);
  if (m) {
    let lat = +m[1] + +m[2]/60;
    let lng = +m[4] + +m[5]/60;
    if (m[3].toUpperCase()==='S') lat=-lat;
    if (m[6].toUpperCase()==='W') lng=-lng;
    return [+lat.toFixed(5), +lng.toFixed(5)];
  }
  m = s.match(/(-?\d+\.\d+)\s*([NS])[,\s]+(-?\d+\.\d+)\s*([EW])/i);
  if (m) {
    let lat = +m[1], lng = +m[3];
    if (m[2].toUpperCase()==='S') lat=-lat;
    if (m[4].toUpperCase()==='W') lng=-lng;
    return [+lat.toFixed(5), +lng.toFixed(5)];
  }
  m = s.match(/(-?\d+\.\d+)\u00B0?\s*,?\s*(-?\d+\.\d+)\u00B0?/);
  if (m) {
    let lat=+m[1], lng=+m[2];
    if (lat>=-90 && lat<=90 && lng>=-180 && lng<=180) return [+lat.toFixed(5), +lng.toFixed(5)];
  }
  return null;
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row=[]; field=''; }
      else if (c === '\r') {}
      else field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

async function fetchLZData() {
  try {
    const res = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('Sheet fetch failed: ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    let headerIdx = -1;
    for (let i = 0; i < Math.min(rows.length, 10); i++) {
      if (rows[i].some(c => c && c.toLowerCase().includes('lz name'))) {
        headerIdx = i; break;
      }
    }
    if (headerIdx === -1) headerIdx = 2;
    const lzs = [];
    let merged = null;
    for (let i = headerIdx + 1; i < rows.length; i++) {
      const r = rows[i];
      const name = (r[0] || '').trim();
      if (name) {
        if (merged) lzs.push(merged);
        let lat = parseFloat(r[1]);
        let lng = parseFloat(r[2]);
        if (isNaN(lat) || isNaN(lng)) {
          const parsed = parseCoordPair((r[3] || '').trim());
          if (parsed) { lat = parsed[0]; lng = parsed[1]; }
          else { lat = null; lng = null; }
        }
        merged = { name, lat, lng,
          status: (r[4] || '').trim(), vehicle: (r[5] || '').trim(),
          surface: (r[6] || '').trim(), cell: (r[7] || '').trim(),
          notes: (r[8] || '').trim() };
      } else if (merged && r[3]) {
        const combined = ((merged._rawCoord || '') + ' ' + r[3]).trim();
        const parsed = parseCoordPair(combined);
        if (parsed) { merged.lat = parsed[0]; merged.lng = parsed[1]; }
      }
    }
    if (merged) lzs.push(merged);
    return lzs.filter(lz => lz.lat !== null && lz.lng !== null && !isNaN(lz.lat) && !isNaN(lz.lng));
  } catch (e) {
    console.error('Failed to load LZ data:', e);
    return [];
  }
}

function renderLZsFromData() {
  // Remove old LZ markers from the map and features array
  lzRenderedLayers.forEach(item => {
    if (item.group && item.layer) item.group.removeLayer(item.layer);
    const idx = features.indexOf(item.feature);
    if (idx > -1) features.splice(idx, 1);
  });
  lzRenderedLayers = [];

  LZ_POINTS.forEach(lz => {
    const color = lz.status === 'Approved' ? 'lz_approved' :
                  lz.status === 'Unapproved' ? 'prohibited' : 'lz_caution';
    const cssColor = COLORS[color];
    const descParts = [];
    if (lz.vehicle) descParts.push('\ud83d\ude9b ' + lz.vehicle);
    if (lz.surface) descParts.push('\ud83c\udfd4 ' + lz.surface);
    if (lz.cell)    descParts.push('\ud83d\udcf6 Cell: ' + lz.cell);
    if (lz.notes)   descParts.push(lz.notes);
    const desc = descParts.join('  \u00b7  ');

    const isLZ = (color === 'lz_approved' || color === 'lz_caution');
    const layer = L.marker([lz.lat, lz.lng], { icon: markerIcon(cssColor, isLZ) });
    const navBtn = '<a class="popup-nav-btn" href="https://www.google.com/maps/dir/?api=1&destination=' + lz.lat + ',' + lz.lng + '" target="_blank">\u25b6 Navigate Here</a>';
    const popupHTML = '<div class="popup-cat">' + (LABELS[color] || color) + '</div>' +
                      '<div class="popup-name" style="color:' + cssColor + '">' + lz.name + '</div>' +
                      '<div class="popup-folder">LZ Points</div>' +
                      (desc ? '<div class="popup-note">' + desc + '</div>' : '') + navBtn;
    layer.bindPopup(popupHTML, { className: 'custom-popup', maxWidth: 260 });

    const idx = features.length;
    const feat = {
      folder: 'LZ Points', name: lz.name, desc, color,
      shape: 'point', coords: [lz.lat, lz.lng],
      lat: lz.lat, lng: lz.lng,
      idx, leafletLayer: layer
    };
    layer.on('click', () => highlightCard(idx));
    layerGroups[color].addLayer(layer);
    features.push(feat);
    lzRenderedLayers.push({ group: layerGroups[color], layer, feature: feat });
  });

  updateCounts();
  renderList(features);

  const total = 52 + LZ_POINTS.length;
  const totalEl = document.getElementById('totalCount');
  if (totalEl) totalEl.textContent = total + ' features';
  const statusEl = document.querySelector('.header-right .status-item');
  if (statusEl) {
    const now = new Date();
    const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    statusEl.innerHTML = '<span style="color:#2ed573">\u25cf ' + total + ' features \u00b7 live ' + time + '</span>';
  }
}

async function loadAndRenderLZs() {
  const statusEl = document.querySelector('.header-right .status-item');
  if (statusEl) statusEl.innerHTML = '<span style="color:#8a8fa8">\u21bb Loading live data...</span>';
  LZ_POINTS = await fetchLZData();
  renderLZsFromData();
}

  autocomplete.addListener('place_changed', () => {
    selectedPlace = autocomplete.getPlace();
    // Clear LZ preview if user selected a Google Places result
    if (selectedPlace && selectedPlace.geometry) {
      hideLZPreview();
      matchedLZ = null;
      document.getElementById('navBtn').textContent = '▶ Open in Google Maps';
    }
  });
}

function onNavInput() {
  const val = document.getElementById('navInput').value.trim();
  const valLower = val.toLowerCase();
  selectedPlace = null;

  if (!val) {
    hideLZPreview();
    hideNearbyList();
    matchedLZ = null;
    document.getElementById('navBtn').textContent = '▶ Open in Google Maps';
    return;
  }

  // --- 1. NAME MATCH (exact then partial) ---
  let lz = LZ_POINTS.find(l => l.name.toLowerCase() === valLower)
         || LZ_POINTS.find(l => l.name.toLowerCase().includes(valLower));

  // --- 2. COORDINATE MATCH ---
  let parsed = null;
  if (!lz) {
    parsed = parseCoords(val);
    if (parsed) {
      // Try exact match first (within 100m)
      lz = findNearbyLZ(parsed.lat, parsed.lng, 100);
    }
  }

  if (lz) {
    matchedLZ = lz;
    showLZPreview(lz);
    hideNearbyList();
    const feat = features.find(f => f.name === lz.name && f.shape === 'point');
    if (feat) {
      map.setView([lz.lat, lz.lng], 15);
      feat.leafletLayer.openPopup();
      highlightCard(feat.idx);
    }
  } else if (parsed) {
    // Coords entered but no exact LZ match → show nearby LZs within 5 miles
    matchedLZ = null;
    hideLZPreview();
    const nearby = findNearbyLZs(parsed.lat, parsed.lng, 8047, 5); // 5 miles = 8047m
    showNearbyList(parsed, nearby);
    document.getElementById('navBtn').textContent = '▶ Navigate to These Coords';
    // Drop a temporary marker at the coords + pan to it
    if (window._tempCoordMarker) map.removeLayer(window._tempCoordMarker);
    window._tempCoordMarker = L.marker([parsed.lat, parsed.lng], {
      icon: L.divIcon({
        html: '<div style="width:14px;height:14px;background:#fff;border:3px solid #00e5ff;border-radius:50%;box-shadow:0 0 12px #00e5ff"></div>',
        iconSize:[14,14], iconAnchor:[7,7], className:''
      })
    }).addTo(map).bindPopup(`<div class="popup-cat">ENTERED COORDS</div><div class="popup-name">${parsed.lat.toFixed(5)}, ${parsed.lng.toFixed(5)}</div>`, {className:'custom-popup'});
    map.setView([parsed.lat, parsed.lng], 13);
    matchedLZ = { lat: parsed.lat, lng: parsed.lng, name: 'Custom Coordinates' };
  } else {
    matchedLZ = null;
    hideLZPreview();
    hideNearbyList();
    document.getElementById('navBtn').textContent = '▶ Open in Google Maps';
  }
}

function showNearbyList(coords, nearby) {
  let el = document.getElementById('nearbyList');
  if (!el) {
    // Create the nearby list element below the preview
    el = document.createElement('div');
    el.id = 'nearbyList';
    el.style.cssText = 'margin-top:8px;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:10px 12px;position:relative;overflow:hidden';
    const preview = document.getElementById('lzPreview');
    preview.parentNode.insertBefore(el, preview.nextSibling);
  }
  
  const milesFromCoords = nearby.map(n => (n.distMeters / 1609.34).toFixed(2));
  let html = `<div style="font-family:var(--mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text2);margin-bottom:6px">📍 Coords entered — nearby LZs:</div>`;
  
  if (nearby.length === 0) {
    html += `<div style="font-size:11px;color:var(--text2);padding:4px 0">No LZs within 5 miles. You can still navigate to these coordinates.</div>`;
  } else {
    nearby.forEach((lz, i) => {
      const statusColor = lz.status === 'Approved' ? '#00e5ff' : lz.status === 'Unapproved' ? '#ff4757' : '#ffe234';
      html += `<div onclick="selectNearbyLZ(${i})" style="cursor:pointer;padding:6px 8px;margin:3px 0;background:rgba(0,0,0,0.2);border-radius:4px;display:flex;justify-content:space-between;align-items:center;gap:8px" onmouseover="this.style.background='rgba(0,229,255,0.1)'" onmouseout="this.style.background='rgba(0,0,0,0.2)'">
        <div style="overflow:hidden;flex:1">
          <div style="font-size:12px;color:${statusColor};font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lz.name}</div>
          <div style="font-size:10px;color:var(--text2)">${lz.vehicle || ''} ${lz.surface ? '· ' + lz.surface : ''}</div>
        </div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--text2);white-space:nowrap">${milesFromCoords[i]} mi</div>
      </div>`;
    });
  }
  el.innerHTML = html;
  el.style.display = 'block';
  window._nearbyResults = nearby;
}

function hideNearbyList() {
  const el = document.getElementById('nearbyList');
  if (el) el.style.display = 'none';
  if (window._tempCoordMarker) {
    map.removeLayer(window._tempCoordMarker);
    window._tempCoordMarker = null;
  }
}

function selectNearbyLZ(i) {
  const lz = window._nearbyResults[i];
  if (!lz) return;
  document.getElementById('navInput').value = lz.name;
  onNavInput();
}

// Parse many coordinate formats into {lat, lng}
function parseCoords(input) {
        if (!input) return null;
        // Normalize Unicode: smart quotes, primes, dashes, NBSP -> ASCII
        let s = String(input)
          .replace(/[\u2018\u2019\u02BC\u2032]/g, "'")
          .replace(/[\u201C\u201D\u2033]/g, '"')
          .replace(/[\u2010\u2011\u2012\u2013\u2014\u2212]/g, '-')
          .replace(/\u00A0/g, ' ')
          .trim()
          .replace(/\s+/g, ' ');

        // European comma-as-decimal pattern
        if (/^-?\d+,\d+\s*[;\s]\s*-?\d+,\d+$/.test(s)) {
          s = s.replace(/,/g, '.').replace(/;/g, ' ');
        } else {
          s = s.replace(/;/g, ',');
        }

        // 1) Decimal
        let m = s.match(/^(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)$/);
        if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };

        // 2) DDM, hemisphere suffix
        m = s.match(/(\d+)\s+([\d.]+)'?\s*([NS])[,\s]+(\d+)\s+([\d.]+)'?\s*([EW])/i);
        if (m) {
          let lat = parseFloat(m[1]) + parseFloat(m[2]) / 60;
          let lng = parseFloat(m[4]) + parseFloat(m[5]) / 60;
          if (m[3].toUpperCase() === 'S') lat = -lat;
          if (m[6].toUpperCase() === 'W') lng = -lng;
          return { lat, lng };
        }

        // 3) DDM, hemisphere prefix
        m = s.match(/([NS])\s*(\d+)\s+([\d.]+)'?[,\s]+([EW])\s*(\d+)\s+([\d.]+)'?/i);
        if (m) {
          let lat = parseFloat(m[2]) + parseFloat(m[3]) / 60;
          let lng = parseFloat(m[5]) + parseFloat(m[6]) / 60;
          if (m[1].toUpperCase() === 'S') lat = -lat;
          if (m[4].toUpperCase() === 'W') lng = -lng;
          return { lat, lng };
        }

        // 4) DMS, hemisphere suffix
        m = s.match(/(\d+)[\u00B0\s]([\d.]+)['\s]([\d.]+)"?\s*([NS])[,\s]+(\d+)[\u00B0\s]([\d.]+)['\s]([\d.]+)"?\s*([EW])/i);
        if (m) {
          let lat = parseFloat(m[1]) + parseFloat(m[2]) / 60 + parseFloat(m[3]) / 3600;
          let lng = parseFloat(m[5]) + parseFloat(m[6]) / 60 + parseFloat(m[7]) / 3600;
          if (m[4].toUpperCase() === 'S') lat = -lat;
          if (m[8].toUpperCase() === 'W') lng = -lng;
          return { lat, lng };
        }

        // 5) DMS, hemisphere prefix
        m = s.match(/([NS])\s*(\d+)[\u00B0\s]([\d.]+)['\s]([\d.]+)"?[,\s]+([EW])\s*(\d+)[\u00B0\s]([\d.]+)['\s]([\d.]+)"?/i);
        if (m) {
          let lat = parseFloat(m[2]) + parseFloat(m[3]) / 60 + parseFloat(m[4]) / 3600;
          let lng = parseFloat(m[6]) + parseFloat(m[7]) / 60 + parseFloat(m[8]) / 3600;
          if (m[1].toUpperCase() === 'S') lat = -lat;
          if (m[5].toUpperCase() === 'W') lng = -lng;
          return { lat, lng };
        }

        return null;
      }

// Haversine distance in meters between two lat/lng points
function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// Find closest LZ within toleranceMeters (default ~100m for exact match)
function findNearbyLZ(lat, lng, toleranceMeters = 100) {
  let best = null, bestDist = Infinity;
  LZ_POINTS.forEach(lz => {
    if (lz.lat == null || lz.lng == null) return;
    const dist = distanceMeters(lat, lng, lz.lat, lz.lng);
    if (dist < toleranceMeters && dist < bestDist) {
      bestDist = dist;
      best = { ...lz, distMeters: dist };
    }
  });
  return best;
}

// Find all LZs within radiusMeters, sorted by distance
function findNearbyLZs(lat, lng, radiusMeters = 5000, max = 5) {
  const results = [];
  LZ_POINTS.forEach(lz => {
    if (lz.lat == null || lz.lng == null) return;
    const dist = distanceMeters(lat, lng, lz.lat, lz.lng);
    if (dist <= radiusMeters) {
      results.push({ ...lz, distMeters: dist });
    }
  });
  results.sort((a, b) => a.distMeters - b.distMeters);
  return results.slice(0, max);
}

function showLZPreview(lz) {
  const color = lz.status === 'Approved' ? '#00e5ff' : lz.status === 'Unapproved' ? '#ff4757' : '#ffe234';
  document.getElementById('lzPreviewBar').style.background = color;
  document.getElementById('lzPreviewBadge').style.color = color;
  document.getElementById('lzPreviewBadge').style.background = color + '22';
  document.getElementById('lzPreviewBadge').textContent = lz.status || 'PENDING';
  document.getElementById('lzPreviewName').style.color = color;
  document.getElementById('lzPreviewName').textContent = lz.name;

  const rows = [];
  if (lz.vehicle) rows.push(`<span style="color:var(--text2)">🚛 Vehicle</span>&nbsp;&nbsp;<span style="color:var(--text)">${lz.vehicle}</span>`);
  if (lz.surface) rows.push(`<span style="color:var(--text2)">🏔 Surface</span>&nbsp;&nbsp;<span style="color:var(--text)">${lz.surface}</span>`);
  if (lz.cell)    rows.push(`<span style="color:var(--text2)">📶 Cell</span>&nbsp;&nbsp;<span style="color:var(--text)">${lz.cell}</span>`);
  if (lz.notes)   rows.push(`<span style="color:var(--text2)">📋 Notes</span>&nbsp;&nbsp;<span style="color:var(--text)">${lz.notes}</span>`);
  document.getElementById('lzPreviewDetails').innerHTML = rows.join('<br>');
  document.getElementById('lzPreviewCoords').textContent = `${lz.lat.toFixed(5)}, ${lz.lng.toFixed(5)}`;
  document.getElementById('lzPreview').style.display = 'block';
  document.getElementById('navBtn').textContent = `▶ Navigate to ${lz.name}`;
}

function hideLZPreview() {
  document.getElementById('lzPreview').style.display = 'none';
}

function clearNavInput() {
  document.getElementById('navInput').value = '';
  hideLZPreview();
  matchedLZ = null;
  document.getElementById('navBtn').textContent = '▶ Open in Google Maps';
}

function openNavigation() {
  const input = document.getElementById('navInput').value.trim();
  if (!input) return;

  // If a known LZ is matched — navigate to its exact coords
  if (matchedLZ) {
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${matchedLZ.lat},${matchedLZ.lng}`, '_blank');
    return;
  }

  // Use Google Places autocomplete result
  if (selectedPlace && selectedPlace.geometry) {
    const lat = selectedPlace.geometry.location.lat();
    const lng = selectedPlace.geometry.location.lng();
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
    return;
  }

  // Fallback: raw text to Google Maps
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(input)}`, '_blank');
}

// Allow Enter key
document.getElementById('navInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { setTimeout(openNavigation, 200); }
});

// --- LAYER TOGGLES ---
function toggleLayer(type) {
  const tog = document.getElementById('tog-'+type);
  if (!tog) return;
  tog.checked ? map.addLayer(layerGroups[type]) : map.removeLayer(layerGroups[type]);
}

function updateCounts() {
  Object.keys(layerGroups).forEach(t => {
    const el = document.getElementById('cnt-'+t);
    if (el) el.textContent = features.filter(f=>f.color===t).length;
  });
}

function renderList(list) {
  const el = document.getElementById('featureList');
  if (!list.length) { el.innerHTML = '<div style="padding:16px;font-size:12px;color:var(--text2);text-align:center">No matching features</div>'; return; }
  const grouped = {};
  list.forEach(f => { (grouped[f.folder]=grouped[f.folder]||[]).push(f); });
  let html = '';
  Object.entries(grouped).forEach(([folder, items]) => {
    html += `<div class="section-header">${folder.length>35?folder.slice(0,32)+'...':folder}</div>`;
    items.forEach(f => {
      html += `<div class="rc ${f.color}" id="card-${f.idx}" onclick="focusFeature(${f.idx})">
        <div class="rc-header">
          <span class="rc-name">${f.name}</span>
          <span class="rc-badge b-${f.color}">${LABELS[f.color]||f.color}</span>
        </div>
        ${f.desc ? `<div class="rc-note">${f.desc}</div>` : ''}
      </div>`;
    });
  });
  el.innerHTML = html;
}

function filterList() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  renderList(q ? features.filter(f =>
    f.name.toLowerCase().includes(q) || f.desc.toLowerCase().includes(q) || f.folder.toLowerCase().includes(q)
  ) : features);
}

function focusFeature(idx) {
  const f = features[idx];
  if (!f) return;
  f.leafletLayer.openPopup();
  if (f.shape === 'point') map.setView(f.coords, 15);
  else map.fitBounds(f.leafletLayer.getBounds(), {padding:[40,40]});
  highlightCard(idx);
}

function highlightCard(idx) {
  document.querySelectorAll('.rc').forEach(c => c.style.borderColor='');
  const card = document.getElementById('card-'+idx);
  if (card) {
    card.style.borderColor = COLORS[features[idx].color]||'var(--border2)';
    card.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

function fitAll() {
  const all = [];
  features.forEach(f => {
    if (f.shape==='point') all.push(f.coords);
    else all.push(...f.coords);
  });
  if (all.length) map.fitBounds(L.latLngBounds(all), {padding:[30,30]});
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(KML_DATA,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='routeguard-data.json'; a.click();
}
</script>
